version: 2
updates:
  # pnpm workspace with a single root pnpm-lock.yaml: Dependabot's own
  # guidance (dependabot/dependabot-core#11487) is to NOT also configure
  # per-package subdirectory entries here, since they scan the same root
  # lockfile and produce duplicate PRs for deps that live in apps/*.
  # See PR #42/#43 (vite) and #37/#44 (lucide-react) for what that looked like.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 8
    labels: ["dependencies"]
    groups:
      backend:
        patterns:
          - "@fastify/*"
          - "fastify"
        applies-to: "version-updates"
      frontend:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "react"
          - "react-dom"
          - "lucide-react"
        applies-to: "version-updates"
    ignore:
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "execa"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci"]
