version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "root"]
    ignore:
      # pnpm workspace: single root pnpm-lock.yaml means this root entry also
      # sees deps declared only in apps/backend/package.json. Mirror the
      # apps/backend ignore rules here or they get bypassed (see PR #35, #39).
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "execa"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  - package-ecosystem: "npm"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    groups:
      fastify:
        patterns:
          - "@fastify/*"
          - "fastify"
    ignore:
      - dependency-name: "better-sqlite3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "execa"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]

  - package-ecosystem: "npm"
    directory: "/packages/shared"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "shared"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci"]
