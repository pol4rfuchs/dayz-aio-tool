name: Cleanup Workflow Runs

on:
  schedule:
    # täglich um 03:15 UTC
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      keep:
        description: "Anzahl der neuesten Runs, die insgesamt behalten werden sollen"
        required: false
        default: "150"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs (keep newest N total)
        uses: actions/github-script@v7
        with:
          script: |
            const keep = parseInt(
              '${{ inputs.keep }}' || '150',
              10
            );

            core.info(`Ziel: maximal ${keep} Workflow-Runs insgesamt im Repo behalten.`);

            // Alle Runs über alle Workflows hinweg einsammeln (neueste zuerst)
            let allRuns = [];
            let page = 1;
            const per_page = 100;

            while (true) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page,
                page,
              });

              if (data.workflow_runs.length === 0) break;
              allRuns = allRuns.concat(data.workflow_runs);
              page++;

              // Sicherheitsgrenze, falls das Repo extrem viele Runs hat
              if (page > 50) break;
            }

            // Neueste zuerst sortieren
            allRuns.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            );

            core.info(`Gefunden: ${allRuns.length} Workflow-Runs insgesamt.`);

            if (allRuns.length <= keep) {
              core.info("Nichts zu tun, Limit noch nicht erreicht.");
              return;
            }

            const toDelete = allRuns.slice(keep);
            core.info(`Lösche ${toDelete.length} alte Runs...`);

            let deleted = 0;
            let failed = 0;

            for (const run of toDelete) {
              // laufende oder in der Warteschlange befindliche Runs nie löschen
              if (run.status === "in_progress" || run.status === "queued") {
                continue;
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                deleted++;
              } catch (err) {
                failed++;
                core.warning(
                  `Konnte Run ${run.id} (${run.name}, ${run.created_at}) nicht löschen: ${err.message}`
                );
              }
            }

            core.info(`Fertig: ${deleted} Runs gelöscht, ${failed} fehlgeschlagen.`);
            core.info(`Verbleibend im Repo: ~${allRuns.length - deleted} Runs.`);
